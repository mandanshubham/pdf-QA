[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdf-qa"
version = "0.1.0"
description = "Agentic PDF Question-Answering system — learning project"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",       # multipart file upload

    # Config & validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.1",

    # LLM & RAG
    "langchain>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-google-genai>=1.0.6",  # Gemini
    "langchain-openai>=0.1.0",        # OpenAI
    "langchain-anthropic>=0.1.0",     # Anthropic
    "langchain-ollama>=0.1.0",        # Ollama (local bonus)

    # PDF parsing
    "pymupdf>=1.24.0",                # PyMuPDF (fitz)

    # Vector store
    "chromadb>=0.5.0",

    # HTTP streaming / SSE
    "sse-starlette>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",                  # test client for FastAPI
    "ruff>=0.4.0",                    # linter + formatter
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
