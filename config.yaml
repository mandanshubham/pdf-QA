# ============================================================
# PDF-QA Master Configuration
# Override any value via environment variables or .env file.
# Environment variable format: PDF_QA__<SECTION>__<KEY>
# Example: PDF_QA__LLM__PROVIDER=openai
# ============================================================

llm:
  # Provider: "gemini" | "openai" | "anthropic" | "ollama" | "vertexai"
  provider: "gemini"

  # Model names per provider (used as default if not overridden)
  models:
    gemini: "gemini-flash-latest"       # working with this API key
    openai: "gpt-4o-mini"
    anthropic: "claude-3-haiku-20240307"
    ollama: "llama3.2"
    vertexai: "gemini-2.0-flash"

  # Active model (leave empty to use the provider's default above)
  model: ""

  # Generation parameters
  temperature: 0.2
  max_tokens: 2048

embeddings:
  # Provider: "gemini" | "openai" | "huggingface" | "ollama" | "vertexai"
  provider: "gemini"

  models:
    gemini: "models/gemini-embedding-001"  # working with this API key (3072-dim)
    openai: "text-embedding-3-small"
    huggingface: "sentence-transformers/all-MiniLM-L6-v2"
    ollama: "nomic-embed-text"
    vertexai: "text-embedding-004"

  model: ""   # leave empty to use provider default above

retrieval:
  # Number of chunks to retrieve per query
  top_k: 5
  # Minimum similarity score (0.0 – 1.0); chunks below this are dropped
  score_threshold: 0.3

chunking:
  # Characters per chunk
  chunk_size: 1000
  # Overlap between adjacent chunks to preserve context
  chunk_overlap: 200

vector_store:
  # Path where ChromaDB persists data
  persist_directory: ".chroma_db"
  # ChromaDB collection name
  collection_name: "pdf_qa_docs"

api:
  host: "0.0.0.0"
  port: 8000
  # Set to false in production
  cors_allow_all: true
